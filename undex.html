<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PointSheet Pro — IEP Behavior Tracking</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f0f5fc;color:#0d1f3c;min-height:100vh;}
input,button,select{font-family:inherit;}
button{cursor:pointer;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#dce8f7;}
::-webkit-scrollbar-thumb{background:#2556a8;border-radius:3px;}
.hidden{display:none!important;}
.screen{display:none;min-height:100vh;}
.screen.active{display:flex;}
/* ── Layout ── */
.page{flex:1;display:flex;min-height:100vh;}
.sidebar{width:220px;min-width:220px;background:#1a3a6b;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{padding:10px 20px;border-bottom:2px solid #e8cc70;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;background:#fff;box-shadow:0 2px 8px rgba(26,58,107,.08);}
.content{flex:1;overflow-y:auto;padding:18px 22px;}
/* ── Cards ── */
.card{background:#fff;border:1.5px solid #b0c8e8;border-radius:12px;padding:16px 18px;}
/* ── Buttons ── */
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;border:1.5px solid #b0c8e8;background:#fff;color:#1e4d8c;transition:all .15s;}
.btn:hover{opacity:.85;}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-primary{background:#1a3a6b;color:#fff;border-color:#1a3a6b;box-shadow:0 2px 8px rgba(26,58,107,.25);}
.btn-gold{background:#d4a017;color:#0d2a5e;border-color:#d4a017;box-shadow:0 2px 8px rgba(184,134,11,.3);}
.btn-danger{background:#fdeaea;border-color:#f0a0a0;color:#9a1c1c;}
.btn-success{background:#e6f7ee;border-color:#80c8a0;color:#1a7a3c;}
.btn-purple{background:#dce8f7;border-color:#a8c4e8;color:#1a3a6b;}
.btn-ghost{background:transparent;border-color:#b0c8e8;color:#1e4d8c;}
/* ── Inputs ── */
input[type=text],input[type=password],input[type=date],select{background:#fff;border:1.5px solid #b0c8e8;border-radius:8px;padding:8px 12px;color:#0d1f3c;font-size:13px;outline:none;width:100%;}
input[type=text]:focus,input[type=password]:focus,select:focus{border-color:#2556a8;}
/* ── Score buttons ── */
.score-btn{width:32px;height:32px;border-radius:8px;border:2px solid #b0c8e8;background:#fff;color:#5a80b8;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .1s;}
.score-btn.sel-1{border-color:#1a7a3c;background:#e6f7ee;color:#1a7a3c;}
.score-btn.sel-half{border-color:#9a6000;background:#fff4e0;color:#9a6000;}
.score-btn.sel-0{border-color:#9a1c1c;background:#fdeaea;color:#9a1c1c;}
/* ── Badges ── */
.badge{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:700;}
.badge-admin{background:#1a3a6b;color:#fff;}
.badge-cm{background:#2556a8;color:#fff;}
.badge-teacher{background:#fdf6d8;color:#5a3000;border:1px solid #e8cc70;}
/* ── Sidebar nav ── */
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;margin-bottom:3px;border-radius:9px;border:none;background:transparent;color:rgba(255,255,255,.65);font-size:12px;font-weight:400;text-align:left;cursor:pointer;transition:all .15s;}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.15);color:#d4a017;font-weight:700;}
/* ── Table ── */
.data-grid{border-radius:12px;border:1.5px solid #b0c8e8;overflow:hidden;overflow-x:auto;}
.grid-header{display:grid;background:#1a3a6b;padding:10px 0;}
.grid-header>div{font-size:9px;color:rgba(255,255,255,.85);font-weight:700;text-transform:uppercase;text-align:center;padding:0 4px;line-height:1.4;}
.grid-header>.period-col{color:#d4a017;letter-spacing:.5px;text-align:left;padding:0 14px;}
.grid-header>.total-col{color:#d4a017;letter-spacing:.5px;}
.gold-bar{height:3px;background:linear-gradient(90deg,#d4a017,#b8860b,#d4a017);}
.grid-row{display:grid;align-items:center;padding:8px 0;border-bottom:1.5px solid #b0c8e8;}
.grid-row:last-child{border-bottom:none;}
.grid-row:nth-child(odd){background:#f0f5fc;}
.grid-row:nth-child(even){background:#fff;}
.period-label{padding:0 14px;font-size:12px;font-weight:700;color:#1a3a6b;}
.score-cell{display:flex;justify-content:center;gap:4px;}
.total-cell{text-align:center;font-size:12px;font-weight:800;}
/* ── Progress bar ── */
.prog-wrap{height:8px;border-radius:4px;background:#b0c8e8;overflow:hidden;}
.prog-bar{height:100%;border-radius:4px;transition:width .5s;}
/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(26,58,107,.45);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#fff;border:2px solid #a8c4e8;border-radius:16px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(26,58,107,.25);}
.modal-header{background:#1a3a6b;border-radius:10px;padding:14px 16px;margin-bottom:20px;}
/* ── Login ── */
#login-screen{background:linear-gradient(160deg,#0d2a5e,#1a3a6b,#0d2a5e);align-items:center;justify-content:center;padding:20px;}
.login-box{background:#fff;border-radius:20px;overflow:hidden;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(13,31,60,.5);}
.login-header{background:#1a3a6b;padding:28px 30px 24px;border-bottom:4px solid #d4a017;text-align:center;}
.login-body{padding:28px 30px;}
/* ── Toast ── */
#toast{position:fixed;top:16px;right:16px;z-index:9999;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none;border:2px solid;}
/* ── App logo mark ── */
.wc-mark{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
/* ── Summary bars ── */
.pct-green{color:#1a7a3c;} .pct-orange{color:#9a6000;} .pct-red{color:#9a1c1c;}
.bg-green{background:#e6f7ee;} .bg-orange{background:#fff4e0;} .bg-red{background:#fdeaea;}
.bar-green{background:#1a7a3c;} .bar-orange{background:#9a6000;} .bar-red{background:#9a1c1c;}
/* ── Charts ── */
.chart-svg{width:100%;overflow:visible;}
/* ── Print ── */
@media print{
  .no-print{display:none!important;}
  body{background:#fff!important;}
  .print-sheet{display:block!important;}
}
.print-sheet{display:none;}
/* ── Goal list items ── */
.goal-item{background:#dce8f7;border:1.5px solid #a8c4e8;border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:8px;margin-bottom:7px;}
/* ── Flex utils ── */
.flex{display:flex;} .flex-col{flex-direction:column;} .items-center{align-items:center;} .justify-between{justify-content:space-between;} .gap-8{gap:8px;} .gap-10{gap:10px;} .gap-12{gap:12px;} .flex-wrap{flex-wrap:wrap;} .flex-1{flex:1;}
/* ── Responsive grid ── */
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.auto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.auto-grid-sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
const SK={accounts:"psp-accounts",students:"psp-students",assignments:"psp-assign",data:"psp-data",goals:"psp-goals",studentInfo:"psp-studentinfo"};
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

const DEFAULT_GOALS=[
  {id:"on_task",label:"On-Task Behavior",short:"On-Task"},
  {id:"follow_dir",label:"Following Directions",short:"Directions"},
  {id:"peer_intx",label:"Positive Peer Interactions",short:"Peers"},
  {id:"impulse",label:"Controlling Impulse Behavior",short:"Impulse"},
];
const SEED_STUDENTS=["Alex M.","Jordan T.","Casey R.","Sam L.","Riley B."];
const GRADES=["6","7","8"];
const SEED_STUDENT_INFO={
  "Alex M.":{firstName:"Alex",lastName:"M.",grade:"6",teacher:"Teacher 1",iepDate:"2025-09-15"},
  "Jordan T.":{firstName:"Jordan",lastName:"T.",grade:"7",teacher:"Teacher 1",iepDate:"2025-10-01"},
  "Casey R.":{firstName:"Casey",lastName:"R.",grade:"6",teacher:"Teacher 1",iepDate:"2025-08-20"},
  "Sam L.":{firstName:"Sam",lastName:"L.",grade:"8",teacher:"Teacher 2",iepDate:"2025-09-05"},
  "Riley B.":{firstName:"Riley",lastName:"B.",grade:"7",teacher:"Teacher 2",iepDate:"2025-11-10"},
};
function todayKey(){return new Date().toISOString().split("T")[0];}
let STATE={
  accounts: lsGet(SK.accounts)||[
    {id:"admin1",username:"admin",password:"Admin@2024!",role:"admin",displayName:"Site Admin"},
    {id:"cm1",username:"casemanager",password:"cm2024!",role:"casemanager",displayName:"Case Manager"},
    {id:"t1",username:"teacher1",password:"teach1!",role:"teacher",displayName:"Teacher 1"},
    {id:"t2",username:"teacher2",password:"teach2!",role:"teacher",displayName:"Teacher 2"},
  ],
  students: lsGet(SK.students)||SEED_STUDENTS,
  studentInfo: lsGet(SK.studentInfo)||JSON.parse(JSON.stringify(SEED_STUDENT_INFO)),
  assignments: lsGet(SK.assignments)||{t1:["Alex M.","Jordan T.","Casey R."],t2:["Sam L.","Riley B."]},
  data: lsGet(SK.data)||{},
  goals: lsGet(SK.goals)||Object.fromEntries(SEED_STUDENTS.map(n=>[n,DEFAULT_GOALS.map(g=>({...g}))])),
  currentUser: null,
  view: "tracker",
  selStudent: null,
  selDate: todayKey(),
  adminTab: "dashboard",
  cmTeacherMode: false,
};

function save(key){lsSet(SK[key],STATE[key]);}
function saveAll(){["accounts","students","studentInfo","assignments","data","goals"].forEach(k=>save(k));}

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
const HB_PERIOD="HB (Home Base)";
const PERIODS=["HB (Home Base)","Period 1","Period 2","Period 3","Period 4","Period 5","Period 6","Period 7","Period 8"];
const SCORES=[0,0.5,1];

function pct(s,c){return c===0?0:Math.round((s/c)*100);}
function sClr(p){return p>=80?"#1a7a3c":p>=60?"#9a6000":"#9a1c1c";}
function sBg(p){return p>=80?"#e6f7ee":p>=60?"#fff4e0":"#fdeaea";}
function scClr(v){return v===1?"#1a7a3c":v===0.5?"#9a6000":"#9a1c1c";}
function scBg(v){return v===1?"#e6f7ee":v===0.5?"#fff4e0":"#fdeaea";}
function scClass(v){return v===1?"sel-1":v===0.5?"sel-half":v===0?"sel-0":"";}
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,40)+"_"+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function calcTotal(sc,goals){
  let s=0,c=0;
  goals.forEach(g=>PERIODS.forEach(p=>{const v=sc&&sc[p]&&sc[p][g.id];if(v!=null){s+=v;c++;}}));
  return{sum:s,count:c};
}
function emptyScores(goals){
  const r={};PERIODS.forEach(p=>{r[p]={};goals.forEach(g=>{r[p][g.id]=null;});});return r;
}
function getStudentGoals(name){return STATE.goals[name]||[];}
function getScores(name,date){
  const goals=getStudentGoals(name);
  return (STATE.data[name]&&STATE.data[name][date])||emptyScores(goals);
}
function visibleStudents(){
  const u=STATE.currentUser;
  if(!u)return[];
  if(u.role==="casemanager"){
    // In teacher mode show only assigned students, otherwise show all
    if(STATE.cmTeacherMode){
      return (STATE.assignments[u.id]||[]).filter(s=>STATE.students.includes(s));
    }
    return STATE.students;
  }
  return (STATE.assignments[u.id]||[]).filter(s=>STATE.students.includes(s));
}

function getWeekDays(mondayKey){
  const mon=new Date(mondayKey+"T12:00:00");
  return["Mon","Tue","Wed","Thu","Fri"].map((lbl,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return{label:lbl,date:d.toISOString().split("T")[0]};});
}
function getMondayOfWeek(dateStr){
  const d=new Date(dateStr+"T12:00:00");const dow=d.getDay();
  const mon=new Date(d);mon.setDate(d.getDate()-(dow===0?6:dow-1));return mon.toISOString().split("T")[0];
}

═══════════════════════════════════════════════════════════ */
let toastTimer=null;
function toast(msg,type="success"){
  const t=document.getElementById("toast");
  t.textContent=(type==="error"?"❌ ":"✅ ")+msg;
  t.style.background=type==="error"?"#9a1c1c":"#1a3a6b";
  t.style.color="#fff";
  t.style.borderColor=type==="error"?"#f0a0a0":"#d4a017";
  t.style.display="block";
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.style.display="none";},2500);
}

/* ═══════════════════════════════════════════════════════════
   CSV EXPORT
═══════════════════════════════════════════════════════════ */
function exportCSV(date){
  const rows=[];
  STATE.students.forEach(name=>{
    const goals=getStudentGoals(name);
    const dd=STATE.data[name]&&STATE.data[name][date];if(!dd)return;
    if(!rows.length)rows.push(["Student","Date","Period",...goals.map(g=>g.label),"Period Total","Period Max","Period %"]);
    PERIODS.forEach(p=>{const ps=dd[p]||{};const vals=goals.map(g=>ps[g.id]!=null?ps[g.id]:"");const s=goals.reduce((a,g)=>a+(ps[g.id]||0),0);const c=goals.filter(g=>ps[g.id]!=null).length;rows.push([name,date,p,...vals,s,c,c>0?pct(s,c)+"%":""]);});
    const{sum,count}=calcTotal(dd,goals);rows.push([name,date,"DAILY TOTAL",...goals.map(()=>""),sum,count,count>0?pct(sum,count)+"%":""]);rows.push([]);
  });
  if(!rows.length){alert("No data for this date.");return;}
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="behavior_"+date+".csv";a.click();
}
function exportWeeklyCSV(weekStart){
  const days=getWeekDays(weekStart);const rows=[["Student","Goal",...days.map(d=>d.label),"Week Avg","Days"]];
  STATE.students.forEach(name=>{
    const goals=getStudentGoals(name);
    goals.forEach(goal=>{
      const row=[name,goal.label];let tp=0,dwd=0;
      days.forEach(d=>{const dd=STATE.data[name]&&STATE.data[name][d.date];if(!dd){row.push("");return;}let s=0,c=0;PERIODS.forEach(p=>{const v=dd[p]&&dd[p][goal.id];if(v!=null){s+=v;c++;}});if(c>0){const p=pct(s,c);row.push(p+"%");tp+=p;dwd++;}else row.push("");});
      row.push(dwd>0?Math.round(tp/dwd)+"%":"");row.push(dwd);rows.push(row);
    });rows.push([]);
  });
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n")],{type:"text/csv"}));a.download="weekly_"+weekStart+".csv";a.click();
}

function doResetPw(id){
  const np=document.getElementById("rp-new").value;
  const cp=document.getElementById("rp-confirm").value;
  if(!np){toast("Password cannot be empty.","error");return;}
  if(np.length<6){toast("Min 6 characters.","error");return;}
  if(np!==cp){toast("Passwords do not match.","error");return;}
  STATE.accounts=STATE.accounts.map(a=>a.id===id?{...a,password:np}:a);
  save("accounts");
  const u=STATE.accounts.find(a=>a.id===id);
  toast("Password reset for "+(u?u.displayName:"user")+".");
  closeModal();
  // refresh demo list on login page
  renderDemoAccounts();
}

          <button onclick="setCMMode(true)"  style="padding:5px 14px;font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:inherit;background:${STATE.cmTeacherMode?'#1a3a6b':'#fff'};color:${STATE.cmTeacherMode?'#fff':'#1e4d8c'};">✏️ My Class</button>

function setCMMode(teacherMode){
  STATE.cmTeacherMode=teacherMode;
  // Re-select first visible student in new mode
  const vs=visibleStudents();
  if(!STATE.selStudent||!vs.includes(STATE.selStudent)) STATE.selStudent=vs[0]||null;
  renderTopbar();
  renderContent();
}

function setView(v){
  STATE.view=v;
  document.querySelectorAll("[id^='nav-']").forEach(b=>b.classList.remove("active"));
  const nb=document.getElementById("nav-"+v);if(nb)nb.classList.add("active");
  renderContent();
}
function selectStudent(n){STATE.selStudent=n;renderTopbar();renderContent();}
function setDate(d){STATE.selDate=d;renderTopbar();renderContent();}

/* ═══════════════════════════════════════════════════════════
   CONTENT VIEWS
═══════════════════════════════════════════════════════════ */
function renderContent(){
  const v=STATE.view;
  if(v==="tracker")renderTracker();
  else if(v==="summary")renderSummary();
  else if(v==="weekly")renderWeekly();
  else if(v==="students")renderCMStudents();
}

/* ── DATA ENTRY ── */
function renderTracker(){
  const name=STATE.selStudent;
  const goals=name?getStudentGoals(name):[];
  const scores=name?getScores(name,STATE.selDate):{};
  const isCM=STATE.currentUser.role==="casemanager";
  let html="";
  if(!name){document.getElementById("app-content").innerHTML=`<div class="card" style="text-align:center;padding:40px;border:2px dashed #a8c4e8;"><div style="font-size:32px;margin-bottom:10px;">📋</div><div style="font-size:14px;color:#1e4d8c;">No student selected.</div></div>`;return;}
  if(goals.length===0){
    document.getElementById("app-content").innerHTML=`
      <div class="card" style="text-align:center;padding:40px;border:2px dashed #a8c4e8;">
        <div class="wc-mark" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;"><svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="19" fill="#1a3a6b" stroke="#d4a017" stroke-width="2"/><path d="M11 20l6 6 12-12" stroke="#d4a017" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>
        <div style="font-size:15px;color:#1a3a6b;font-weight:700;margin-bottom:8px;">No goals set for ${esc(name)}</div>
        ${isCM?`<button class="btn btn-primary" onclick="openEditGoals('${esc(name)}')">+ Add Goals</button>`:`<div style="font-size:13px;color:#5a80b8;">Ask the case manager to add goals for this student.</div>`}
      </div>`;
    return;
  }
  // Legend
  html+=`<div class="flex gap-10 flex-wrap" style="margin-bottom:12px;">
    ${[{v:0,l:"0 – Did not meet",c:"#9a1c1c",bg:"#fdeaea"},{v:0.5,l:"½ – Partially met",c:"#9a6000",bg:"#fff4e0"},{v:1,l:"1 – Met goal",c:"#1a7a3c",bg:"#e6f7ee"}].map(s=>`<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:${s.c};background:${s.bg};padding:3px 10px;border-radius:20px;font-weight:600;"><div style="width:8px;height:8px;border-radius:50%;background:${s.c};"></div>${s.l}</div>`).join("")}
    ${!isCM?`<div style="font-size:11px;color:#1a3a6b;margin-left:auto;font-weight:600;background:#dce8f7;padding:3px 10px;border-radius:20px;">✅ Live sync to case manager</div>`:""}
  </div>`;
  // Grid
  const cols=`100px repeat(${goals.length},1fr) 75px`;
  html+=`<div class="data-grid" style="margin-bottom:12px;">
    <div class="grid-header" style="grid-template-columns:${cols};min-width:${400+goals.length*60}px;">
      <div class="period-col">Period</div>
      ${goals.map(g=>`<div>${esc(g.label)}</div>`).join("")}
      <div class="total-col" style="color:#d4a017;font-size:10px;text-align:center;">Total</div>
    </div>
    <div class="gold-bar"></div>
    ${PERIODS.map((period,pi)=>{
      const ps=(scores[period]||{});
      const pSum=goals.reduce((a,g)=>a+(ps[g.id]||0),0);
      const pCount=goals.filter(g=>ps[g.id]!=null).length;
      const ppct=pCount>0?pct(pSum,pCount):null;
      return`<div class="grid-row" style="grid-template-columns:${cols};min-width:${400+goals.length*60}px;${period===HB_PERIOD?'background:#fdf6d8;border-left:3px solid #d4a017;':''}">
        <div class="period-label" style="${period===HB_PERIOD?'color:#7a5500;font-weight:800;':''}">${period===HB_PERIOD?'🏠 '+period:period}</div>
        ${goals.map(goal=>`
          <div class="score-cell">
            ${SCORES.map(score=>`<button class="score-btn ${ps[goal.id]===score?scClass(score):""}" onclick="setScore('${esc(period)}','${esc(goal.id)}',${score})">${score===0.5?"½":score}</button>`).join("")}
          </div>
        `).join("")}
        <div class="total-cell">${ppct!==null?`<span style="background:${sBg(ppct)};color:${sClr(ppct)};padding:2px 8px;border-radius:12px;font-weight:800;">${pSum}/${pCount}</span>`:`<span style="color:#5a80b8;">—</span>`}</div>
      </div>`;
    }).join("")}
  </div>`;
  // Daily total
  const{sum,count}=calcTotal(scores,goals);const p=pct(sum,count);
  html+=`<div class="card flex items-center justify-between flex-wrap gap-12" style="border:2px solid #a8c4e8;background:#dce8f7;">
    <div>
      <div style="font-size:11px;color:#1e4d8c;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-weight:700;">Daily Total — ${esc(name)}</div>
      <div style="font-size:26px;font-weight:800;color:${count>0?sClr(p):"#5a80b8"};">
        ${count>0?sum+"/"+count:"No data entered"}
        ${count>0?`<span style="font-size:16px;margin-left:10px;background:${sBg(p)};color:${sClr(p)};padding:2px 12px;border-radius:20px;">${p}%</span>`:""}
      </div>
    </div>
    ${count>0?`<div style="flex:1;max-width:260px;">
      <div class="prog-wrap"><div class="prog-bar" style="width:${p}%;background:${sClr(p)};"></div></div>
      <div class="flex justify-between" style="font-size:10px;color:#5a80b8;margin-top:4px;font-weight:600;"><span>0%</span><span style="color:#b8860b;">Target: 80%</span><span>100%</span></div>
    </div>`:""}
  </div>`;
  document.getElementById("app-content").innerHTML=html;
}

function setScore(period,gid,val){
  const name=STATE.selStudent;if(!name)return;
  const goals=getStudentGoals(name);
  if(!STATE.data[name])STATE.data[name]={};
  if(!STATE.data[name][STATE.selDate])STATE.data[name][STATE.selDate]=emptyScores(goals);
  // ensure goal exists in period
  goals.forEach(g=>{if(STATE.data[name][STATE.selDate][period][g.id]===undefined)STATE.data[name][STATE.selDate][period][g.id]=null;});
  const cur=STATE.data[name][STATE.selDate][period][gid];
  STATE.data[name][STATE.selDate][period][gid]=(cur===val)?null:val;
  save("data");
  renderTracker();
}

/* ── CLASS SUMMARY ── */
function renderSummary(){
  const vs=visibleStudents();
  const date=STATE.selDate;
  let html=`<div style="font-size:13px;color:#1e4d8c;margin-bottom:14px;font-weight:600;">All students · ${date}</div>`;
  // Student rows
  vs.forEach(name=>{
    const goals=getStudentGoals(name);
    const sc=STATE.data[name]&&STATE.data[name][date];
    let sum=0,count=0,hasData=false;
    if(sc&&goals.length){const r=calcTotal(sc,goals);sum=r.sum;count=r.count;hasData=count>0;}
    const p=pct(sum,count);
    html+=`<div class="card flex items-center gap-10 flex-wrap" style="margin-bottom:8px;padding:12px 16px;">
      <div style="width:120px;font-size:13px;font-weight:700;color:#1a3a6b;cursor:pointer;" onclick="selectStudent('${esc(name)}');setView('tracker');">${esc(name)}</div>

      <div style="flex:1;min-width:80px;"><div class="prog-wrap"><div class="prog-bar" style="width:${hasData?p:0}%;background:${hasData?sClr(p):"#b0c8e8"};"></div></div></div>
      <div style="font-size:14px;font-weight:800;background:${hasData?sBg(p):"#dce8f7"};color:${hasData?sClr(p):"#5a80b8"};padding:3px 12px;border-radius:20px;min-width:55px;text-align:center;">${hasData?p+"%":"—"}</div>
      <div class="flex gap-8">
        <button class="btn btn-sm btn-ghost" onclick="selectStudent('${esc(name)}');setView('tracker');">📝</button>
        <button class="btn btn-sm btn-purple" onclick="openEditGoals('${esc(name)}')">🎯 Goals</button>
        <button class="btn btn-sm btn-danger" onclick="removeStudent('${esc(name)}')">🗑️</button>
      </div>
    </div>`;
  });
  // Goal breakdown for selected student
  if(STATE.selStudent){
    const goals=getStudentGoals(STATE.selStudent);
    const sc=STATE.data[STATE.selStudent]&&STATE.data[STATE.selStudent][date];
    html+=`<div style="font-size:11px;color:#2556a8;text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin:22px 0 10px;">Goal Breakdown — ${esc(STATE.selStudent)}</div>`;
    if(goals.length===0){html+=`<div style="font-size:13px;color:#5a80b8;">No goals configured. <button style="color:#1a3a6b;background:none;border:none;cursor:pointer;font-size:13px;font-weight:700;" onclick="openEditGoals('${esc(STATE.selStudent)}')">Add goals →</button></div>`;}
    else{
      html+=`<div class="auto-grid">`;
      goals.forEach(g=>{
        let s=0,c=0;
        if(sc)PERIODS.forEach(p=>{const v=sc[p]&&sc[p][g.id];if(v!=null){s+=v;c++;}});
        const gp=pct(s,c);
        html+=`<div class="card" style="border:2px solid #a8c4e8;">
          <div style="font-size:11px;color:#1e4d8c;margin-bottom:7px;font-weight:600;line-height:1.3;">${esc(g.label)}</div>
          <div style="font-size:22px;font-weight:800;color:${c>0?sClr(gp):"#5a80b8"};">${c>0?gp+"%":"—"}</div>
          <div style="font-size:11px;color:#5a80b8;margin-top:3px;">${s}/${c} pts</div>
        </div>`;
      });
      html+=`</div>`;
    }
  }
  document.getElementById("app-content").innerHTML=html;
}

/* ── WEEKLY REPORT ── */
let _weekStart=getMondayOfWeek(todayKey());
let _weekChartStudent=null;
function renderWeekly(){
  if(!_weekChartStudent||!STATE.students.includes(_weekChartStudent)) _weekChartStudent=STATE.students[0]||null;
  const days=getWeekDays(_weekStart);
  const mon=new Date(_weekStart+"T12:00:00");const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  const wLabel=mon.toLocaleDateString("en-US",{month:"short",day:"numeric"})+" – "+fri.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  const GC=["#1a3a6b","#b8860b","#1a7a3c","#c0392b","#1a6090","#8e44ad","#d35400","#16a085"];

  // Student week data
  const swData=STATE.students.map(name=>{
    const goals=getStudentGoals(name);
    const dp=getWeekDays(_weekStart).map(d=>{const sc=STATE.data[name]&&STATE.data[name][d.date];if(!sc||!goals.length)return null;const{sum,count}=calcTotal(sc,goals);return count>0?pct(sum,count):null;});
    const valid=dp.filter(v=>v!==null);
    return{name,weekAvg:valid.length?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length):null,daysLogged:valid.length};
  });

  const goals=_weekChartStudent?getStudentGoals(_weekChartStudent):[];
  // Bar data for selected student
  const barData=days.map((d,i)=>{
    const sc=STATE.data[_weekChartStudent]&&STATE.data[_weekChartStudent][d.date];
    if(!sc||!goals.length)return{label:d.label,val:null,x:28+i*58};
    const{sum,count}=calcTotal(sc,goals);
    return{label:d.label,val:count>0?pct(sum,count):null,x:28+i*58};
  });
  // Goal week data
  const goalWeekData=goals.map(goal=>{
    const dv=days.map(d=>{const sc=STATE.data[_weekChartStudent]&&STATE.data[_weekChartStudent][d.date];if(!sc)return null;let s=0,c=0;PERIODS.forEach(p=>{const v=sc[p]&&sc[p][goal.id];if(v!=null){s+=v;c++;}});return c>0?pct(s,c):null;});
    const valid=dv.filter(v=>v!==null);
    return{...goal,dayVals:dv,avg:valid.length?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length):null};
  });
  // Summary table
  const summaryTable=STATE.students.map(name=>{
    const g=getStudentGoals(name);
    const ga=g.map(goal=>{let total=0,cnt=0;days.forEach(d=>{const sc=STATE.data[name]&&STATE.data[name][d.date];if(!sc)return;let s=0,c=0;PERIODS.forEach(p=>{const v=sc[p]&&sc[p][goal.id];if(v!=null){s+=v;c++;}});if(c>0){total+=pct(s,c);cnt++;}});return cnt>0?Math.round(total/cnt):null;});
    const valid=ga.filter(v=>v!==null);
    return{name,goalAvgs:ga,goals:g,overall:valid.length?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length):null};
  });

  const cH=150,cW=370,BW=26;
  // Build SVG bar chart
  const barSVG=`<svg viewBox="0 0 ${cW} ${cH+46}" class="chart-svg">
    ${[0,25,50,75,100].map(v=>`<g><line x1="22" y1="${cH-v*cH/100}" x2="${cW-8}" y2="${cH-v*cH/100}" stroke="#b0c8e8" stroke-width="1"/><text x="18" y="${cH-v*cH/100+4}" text-anchor="end" font-size="9" fill="#5a80b8">${v}</text></g>`).join("")}
    <line x1="22" y1="${cH-80*cH/100}" x2="${cW-8}" y2="${cH-80*cH/100}" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="${cW-6}" y="${cH-80*cH/100-3}" font-size="8" fill="#b8860b" font-weight="bold">80%</text>
    ${barData.map(bar=>bar.val!==null?
      `<rect x="${bar.x-BW/2}" y="${cH-bar.val*cH/100}" width="${BW}" height="${bar.val*cH/100}" rx="4" fill="${sClr(bar.val)}" opacity="0.85"/>
       <text x="${bar.x}" y="${cH-bar.val*cH/100-4}" text-anchor="middle" font-size="10" font-weight="700" fill="${sClr(bar.val)}">${bar.val}%</text>
       <text x="${bar.x}" y="${cH+14}" text-anchor="middle" font-size="11" font-weight="600" fill="#0d1f3c">${bar.label}</text>`:
      `<rect x="${bar.x-BW/2}" y="${cH-6}" width="${BW}" height="6" rx="3" fill="#b0c8e8"/>
       <text x="${bar.x}" y="${cH+14}" text-anchor="middle" font-size="11" font-weight="600" fill="#5a80b8">${bar.label}</text>`
    ).join("")}
    <line x1="22" y1="0" x2="22" y2="${cH}" stroke="#b0c8e8" stroke-width="1"/>
    <line x1="22" y1="${cH}" x2="${cW-8}" y2="${cH}" stroke="#b0c8e8" stroke-width="1"/>
  </svg>`;
  // Line chart SVG
  const lineSVG=`<svg viewBox="0 0 ${cW} ${cH+28}" class="chart-svg">
    ${[0,25,50,75,100].map(v=>`<line x1="22" y1="${cH-v*cH/100}" x2="${cW-8}" y2="${cH-v*cH/100}" stroke="#b0c8e8" stroke-width="1"/>`).join("")}
    <line x1="22" y1="${cH-80*cH/100}" x2="${cW-8}" y2="${cH-80*cH/100}" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="5,3"/>
    ${goalWeekData.map((g,gi)=>{
      const pts=g.dayVals.map((v,i)=>v!==null?{x:barData[i].x,y:cH-v*cH/100}:null);
      let d="";pts.forEach((p,i)=>{if(p){if(!d||pts.slice(0,i).every(x=>x===null))d+=`M${p.x},${p.y}`;else d+=`L${p.x},${p.y}`;}});
      const col=GC[gi%GC.length];
      return`${d?`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`:""}
      ${pts.map((p,i)=>p?`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${col}" stroke="#fff" stroke-width="1.5"/>`:"").join("")}`;
    }).join("")}
    <line x1="22" y1="0" x2="22" y2="${cH}" stroke="#b0c8e8" stroke-width="1"/>
    <line x1="22" y1="${cH}" x2="${cW-8}" y2="${cH}" stroke="#b0c8e8" stroke-width="1"/>
    ${barData.map(bar=>`<text x="${bar.x}" y="${cH+14}" text-anchor="middle" font-size="11" font-weight="600" fill="#0d1f3c">${bar.label}</text>`).join("")}
  </svg>`;

  let html=`
    <!-- Week nav -->
    <div class="flex items-center justify-between flex-wrap gap-10" style="margin-bottom:18px;">
      <div class="flex items-center gap-10">
        <button class="btn btn-sm btn-ghost" onclick="shiftWeek(-1)">← Prev</button>
        <span style="font-size:14px;font-weight:700;color:#1a3a6b;">${wLabel}</span>
        <button class="btn btn-sm btn-ghost" onclick="shiftWeek(1)">Next →</button>
      </div>
      <button class="btn btn-sm btn-success" onclick="exportWeeklyCSV('${_weekStart}')">⬇ Export Week CSV</button>
    </div>

    <!-- Student overview cards -->
    <div style="font-size:11px;color:#2556a8;text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-bottom:10px;">Weekly Overview — All Students</div>
    <div class="auto-grid" style="margin-bottom:20px;">
      ${swData.map(s=>`<div onclick="setWeekStudent('${esc(s.name)}')" style="background:${_weekChartStudent===s.name?"#dce8f7":"#fff"};border:2px solid ${_weekChartStudent===s.name?"#1a3a6b":"#b0c8e8"};border-radius:12px;padding:14px;cursor:pointer;">
        <div style="font-size:13px;font-weight:700;color:#0d1f3c;margin-bottom:3px;">${esc(s.name)}</div>
        <div style="font-size:10px;color:#5a80b8;margin-bottom:9px;">${getStudentGoals(s.name).length} goals · ${s.daysLogged}/5 days</div>
        <div style="font-size:24px;font-weight:800;color:${s.weekAvg!==null?sClr(s.weekAvg):"#5a80b8"};margin-bottom:6px;">${s.weekAvg!==null?s.weekAvg+"%":"—"}</div>
        <div class="prog-wrap"><div class="prog-bar" style="width:${s.weekAvg!==null?s.weekAvg:0}%;background:${s.weekAvg!==null?sClr(s.weekAvg):"transparent"};"></div></div>
      </div>`).join("")}
    </div>

    <!-- Charts -->
    <div class="card" style="margin-bottom:18px;">
      <div class="flex items-center justify-between flex-wrap gap-8" style="margin-bottom:14px;">
        <div style="font-size:14px;font-weight:700;color:#1a3a6b;">Charts — <span style="color:#b8860b;">${esc(_weekChartStudent||"")}</span></div>
        <div class="flex gap-8 flex-wrap">
          ${STATE.students.map(n=>`<button onclick="setWeekStudent('${esc(n)}')" style="padding:4px 10px;border-radius:12px;border:1.5px solid ${_weekChartStudent===n?"#1a3a6b":"#b0c8e8"};background:${_weekChartStudent===n?"#dce8f7":"#fff"};color:${_weekChartStudent===n?"#1a3a6b":"#1e4d8c"};cursor:pointer;font-size:11px;font-weight:${_weekChartStudent===n?"700":"400"};font-family:inherit;">${esc(n)}</button>`).join("")}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
        <div>
          <div style="font-size:11px;color:#1e4d8c;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;font-weight:600;">Daily Overall %</div>
          ${barSVG}
        </div>

// In-modal goal state
let _modalGoals=[];
function renderGoalEditor(goals){
  _modalGoals=goals.map(g=>({...g}));
  return buildGoalEditorHTML();
}
function buildGoalEditorHTML(){
  return`<div>
    <div style="font-size:11px;color:#1e4d8c;text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-bottom:9px;">Tracking Goals (${_modalGoals.length})</div>
    <div id="goal-list" style="margin-bottom:14px;">
      ${_modalGoals.length===0?`<div style="text-align:center;padding:18px;color:#5a80b8;font-size:13px;background:#dce8f7;border-radius:8px;border:1.5px dashed #a8c4e8;">No goals yet — add one below</div>`:
      _modalGoals.map((g,idx)=>`
        <div class="goal-item">
          <div style="display:flex;flex-direction:column;gap:1px;flex-shrink:0;">
            <button onclick="moveGoal(${idx},-1)" ${idx===0?"disabled":""} style="background:none;border:none;color:${idx===0?"#b0c8e8":"#2556a8"};cursor:${idx===0?"default":"pointer"};font-size:11px;line-height:1;padding:1px 3px;">▲</button>
            <button onclick="moveGoal(${idx},1)" ${idx===_modalGoals.length-1?"disabled":""} style="background:none;border:none;color:${idx===_modalGoals.length-1?"#b0c8e8":"#2556a8"};cursor:${idx===_modalGoals.length-1?"default":"pointer"};font-size:11px;line-height:1;padding:1px 3px;">▼</button>
          </div>
          <div style="flex:1;font-size:13px;color:#0d1f3c;font-weight:500;">${esc(g.label)}</div>
          <button class="btn btn-sm btn-ghost" onclick="editGoalInline(${idx})">✏️</button>
          <button style="background:#fdeaea;border:1.5px solid #f0a0a0;border-radius:6px;padding:4px 8px;color:#9a1c1c;cursor:pointer;font-size:11px;" onclick="removeGoal(${idx})">✕</button>
        </div>
      `).join("")}
    </div>
    <div style="background:#fdf6d8;border:1.5px solid #e8cc70;border-radius:10px;padding:13px;">
      <div style="font-size:11px;color:#7a5500;text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;font-weight:700;">Add Goal</div>
      <div class="flex gap-8">
        <input type="text" id="new-goal-inp" placeholder="e.g. Raising hand, Work completion…" onkeydown="if(event.key==='Enter')addGoalFromModal()" style="flex:1;"/>
        <button class="btn btn-gold" onclick="addGoalFromModal()">+ Add</button>
      </div>
    </div>
  </div>`;
}
function refreshGoalEditor(){document.getElementById("goal-editor-wrap").innerHTML=buildGoalEditorHTML();}
function addGoalFromModal(){
  const inp=document.getElementById("new-goal-inp");
  const lbl=inp.value.trim();if(!lbl)return;
  if(_modalGoals.find(g=>g.label.toLowerCase()===lbl.toLowerCase())){showModalErr("Goal already exists.");return;}
  _modalGoals.push({id:slugify(lbl),label:lbl,short:lbl.slice(0,12)});
  inp.value="";refreshGoalEditor();
}
function removeGoal(idx){_modalGoals.splice(idx,1);refreshGoalEditor();}
function moveGoal(idx,dir){const sw=idx+dir;if(sw<0||sw>=_modalGoals.length)return;[_modalGoals[idx],_modalGoals[sw]]=[_modalGoals[sw],_modalGoals[idx]];refreshGoalEditor();}
function editGoalInline(idx){
  const g=_modalGoals[idx];
  const row=document.getElementById("goal-list").children[idx];
  if(!row)return;
  row.innerHTML=`
    <div class="flex gap-8 items-center" style="flex:1;">
      <input type="text" id="edit-goal-inp" value="${esc(g.label)}" onkeydown="if(event.key==='Enter')saveGoalEdit(${idx})" style="flex:1;" autofocus/>
      <button class="btn btn-sm btn-primary" onclick="saveGoalEdit(${idx})">Save</button>
      <button class="btn btn-sm btn-ghost" onclick="refreshGoalEditor()">✕</button>
    </div>
  `;
  setTimeout(()=>{const i=document.getElementById("edit-goal-inp");if(i)i.focus();},50);
}
function saveGoalEdit(idx){
  const lbl=document.getElementById("edit-goal-inp").value.trim();
  if(!lbl)return;
  _modalGoals[idx]={..._modalGoals[idx],label:lbl,short:lbl.slice(0,12)};
  refreshGoalEditor();
}
function showModalErr(msg){const el=document.getElementById("modal-err");el.textContent=msg;el.style.display="block";}
function saveNewStudent(){
  const name=(document.getElementById("ns-name")||{}).value||"";
  const n=name.trim();
  if(!n){showModalErr("Student name is required.");return;}
  if(_modalGoals.length===0){showModalErr("Add at least one goal.");return;}
  if(STATE.students.includes(n)){showModalErr("Student already exists.");return;}
  STATE.students.push(n);
  STATE.goals[n]=_modalGoals.map(g=>({...g}));
  save("students");save("goals");
  STATE.selStudent=n;
  closeModal();
  toast(n+" added with "+_modalGoals.length+" goal"+(_modalGoals.length!==1?"s":"")+".");
  renderApp();
}
function saveGoals(name){
  if(_modalGoals.length===0){showModalErr("Add at least one goal.");return;}
  STATE.goals[name]=_modalGoals.map(g=>({...g}));
  save("goals");
  closeModal();
  toast("Goals updated for "+name+".");
  renderContent();
  renderTopbar();
}
function removeStudent(name){
  if(!confirm("Remove "+name+"? This cannot be undone."))return;
  STATE.students=STATE.students.filter(s=>s!==name);
  delete STATE.goals[name];
  delete STATE.data[name];
  Object.keys(STATE.assignments).forEach(k=>{STATE.assignments[k]=(STATE.assignments[k]||[]).filter(s=>s!==name);});
  if(STATE.selStudent===name)STATE.selStudent=visibleStudents()[0]||null;
  saveAll();
  toast(name+" removed.","error");
  renderApp();
}

  }).join("")}</tbody></table>

function renderStudentTable(search){
  const s=search.toLowerCase();
  const filtered=STATE.students.filter(function(n){
    if(!s)return true;
    const inf=STATE.studentInfo[n]||{};
    return n.toLowerCase().includes(s)||
      (inf.grade||"").includes(s)||
      (inf.teacher||"").toLowerCase().includes(s)||
      (inf.firstName||"").toLowerCase().includes(s)||
      (inf.lastName||"").toLowerCase().includes(s);
  });
  if(!filtered.length)return'<div style="text-align:center;padding:32px;color:#5a80b8;font-size:13px;">No students found.</div>';
  const byGrade={};
  filtered.forEach(function(n){
    const g=(STATE.studentInfo[n]||{}).grade||"—";
    if(!byGrade[g])byGrade[g]=[];
    byGrade[g].push(n);
  });
  return Object.keys(byGrade).sort(function(a,b){return a==="—"?1:b==="—"?-1:parseInt(a)-parseInt(b);}).map(function(grade){
    const today=new Date();
    return'<div style="margin-bottom:22px;">'+
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">'+
        '<div style="background:#1a3a6b;color:#d4a017;font-size:11px;font-weight:800;padding:3px 12px;border-radius:20px;">GRADE '+esc(grade)+'</div>'+
        '<div style="flex:1;height:1px;background:linear-gradient(90deg,#a8c4e8,transparent);"></div>'+
        '<span style="font-size:11px;color:#5a80b8;font-weight:600;">'+byGrade[grade].length+' student'+(byGrade[grade].length!==1?"s":"")+'</span>'+
      '</div>'+
      byGrade[grade].map(function(name){
        const inf=STATE.studentInfo[name]||{};
        const iepDate=inf.iepDate?new Date(inf.iepDate+"T12:00:00"):null;
        const daysUntilIep=iepDate?Math.round((iepDate-today)/(1000*60*60*24)):null;
        const iepStatus=daysUntilIep===null?"none":daysUntilIep<0?"overdue":daysUntilIep<=30?"soon":"ok";
        const iepColor=iepStatus==="overdue"?"#9a1c1c":iepStatus==="soon"?"#9a6000":"#1a7a3c";
        const iepBg=iepStatus==="overdue"?"#fdeaea":iepStatus==="soon"?"#fff4e0":iepStatus==="ok"?"#e6f7ee":"#f0f5fc";
        const goals=getStudentGoals(name);
        const initial=esc((inf.firstName||name)[0].toUpperCase());
        const iepLabel=inf.iepDate?new Date(inf.iepDate+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"Not set";
        const daysLabel=daysUntilIep===null?"":daysUntilIep<0?"Overdue "+Math.abs(daysUntilIep)+"d":daysUntilIep===0?"Today":daysUntilIep+"d away";
        return'<div class="card" style="margin-bottom:8px;padding:14px 18px;border:1.5px solid #b0c8e8;">'+
          '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">'+
            '<div style="width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#1a3a6b,#2556a8);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#d4a017;flex-shrink:0;font-family:Georgia,serif;">'+initial+'</div>'+
            '<div style="flex:1;min-width:140px;">'+
              '<div style="font-size:14px;font-weight:800;color:#0d1f3c;">'+esc(inf.firstName||"")+" "+esc(inf.lastName||name)+'</div>'+
              '<div style="font-size:11px;color:#5a80b8;margin-top:2px;">'+
                'Grade '+esc(inf.grade||"—")+" &nbsp;·&nbsp; "+
                (inf.teacher?"👩‍🏫 "+esc(inf.teacher)+" &nbsp;·&nbsp; ":"")+
                goals.length+' goal'+(goals.length!==1?"s":"")+
              '</div>'+
            '</div>'+
            '<div style="text-align:center;min-width:110px;">'+
              '<div style="font-size:10px;color:#1e4d8c;font-weight:700;text-transform:uppercase;margin-bottom:3px;">IEP Date</div>'+
              '<span style="background:'+iepBg+';color:'+iepColor+';padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;">'+iepLabel+(iepStatus==="overdue"?" ⚠️":iepStatus==="soon"?" 🔔":"")+'</span>'+
              (daysUntilIep!==null?'<div style="font-size:10px;color:'+iepColor+';margin-top:2px;font-weight:600;">'+daysLabel+'</div>':"")+
            '</div>'+
            '<div style="display:flex;gap:8px;flex-shrink:0;">'+
              '<button class="btn btn-sm btn-ghost" onclick="openViewStudent(\''+esc(name)+'\')">👁 View</button>'+
              '<button class="btn btn-sm btn-purple" onclick="openEditStudentInfo(\''+esc(name)+'\')">✏️ Edit</button>'+
              '<button class="btn btn-sm btn-danger" onclick="removeStudentAdmin(\''+esc(name)+'\')">🗑️ Remove</button>'+
            '</div>'+
          '</div>'+
        '</div>';
      }).join("")+
    '</div>';
  }).join("");
}

  Object.keys(STATE.assignments).forEach(function(k){

// Column aliases — maps whatever headers the user has to our field names
var COL_MAP = {
  firstname:  'firstName',
  first:      'firstName',
  fname:      'firstName',
  'first name':'firstName',
  lastname:   'lastName',
  last:       'lastName',

  'iep date': 'iepDate',
  iep:        'iepDate',
  'iep meeting date':'iepDate',

  trackinggoals:'goals',
  'tracking goals':'goals',
};

function normalizeHeader(h){
  return String(h).toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
}

function parseExcelDate(val){
  // Excel serial date number
  if(typeof val === 'number'){
    var d = new Date(Math.round((val - 25569)*86400*1000));
    return d.toISOString().split('T')[0];
  }
  if(typeof val === 'string' && val.trim()){
    // Try common date formats
    var s = val.trim();
    // Already ISO
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    // MM/DD/YYYY or M/D/YYYY
    var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if(m){
      var yr = m[3].length===2 ? '20'+m[3] : m[3];
      return yr+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
    }
    // Try native parse
    var dt = new Date(s);
    if(!isNaN(dt.getTime())) return dt.toISOString().split('T')[0];
  }
  return '';
}

/* ── Built-in CSV + XLSX parser (no external libraries needed) ── */
function handleImportFile(input){
  var file = input.files[0];
  if(!file){return;}
  input.value = '';
  var name = file.name.toLowerCase();
  var reader = new FileReader();
  if(name.endsWith('.csv')){
    reader.onload = function(e){
      try{
        var rows = parseCSV(e.target.result);
        processImportRows(rows);
      }catch(err){toast('Could not read CSV: '+err.message,'error');}
    };
    reader.readAsText(file);
  } else if(name.endsWith('.xlsx') || name.endsWith('.xls')){
    reader.onload = function(e){
      try{
        var rows = parseXLSX(new Uint8Array(e.target.result));
        processImportRows(rows);
      }catch(err){toast('Could not read Excel file. Try saving as CSV first.','error');}
    };
    reader.readAsArrayBuffer(file);
  } else {
    toast('Please upload a .csv, .xlsx, or .xls file.','error');
  }
}

/* ── Pure JS CSV parser (handles quoted fields, commas inside quotes) ── */
function parseCSV(text){
  var rows = [];
  // Normalize line endings
  var lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  for(var i=0;i<lines.length;i++){
    var line = lines[i];
    if(!line.trim()) continue;
    var cells = [];
    var cur = '';
    var inQ = false;
    for(var j=0;j<line.length;j++){
      var ch = line[j];
      if(ch==='"'){
        if(inQ && line[j+1]==='"'){cur+='"';j++;}
        else{inQ=!inQ;}
      } else if(ch===',' && !inQ){
        cells.push(cur); cur='';
      } else {
        cur+=ch;
      }
    }
    cells.push(cur);
    rows.push(cells);
  }
  return rows;
}

/* ── Minimal XLSX reader — extracts first sheet as rows of strings ──
   Handles the most common Office Open XML format (.xlsx).
   For complex files (merged cells, formulas) CSV export is recommended. ── */
function parseXLSX(uint8){
  // XLSX is a ZIP. Find the shared strings and first sheet XML.
  var zip = unzipSimple(uint8);
  if(!zip){throw new Error('Not a valid XLSX file. Please save as CSV.');}

  // Read shared strings
  var ssXml = zip['xl/sharedStrings.xml'] || '';
  var sharedStrings = [];
  var siRe = /<si>[\s\S]*?<\/si>/g;
  var siMatch;
  while((siMatch=siRe.exec(ssXml))!==null){
    var tRe = /<t[^>]*>([\s\S]*?)<\/t>/g;
    var tMatch; var val='';
    while((tMatch=tRe.exec(siMatch[0]))!==null){ val+=tMatch[1]; }
    sharedStrings.push(val.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'"));
  }

  // Find first sheet
  var sheetXml = zip['xl/worksheets/sheet1.xml'] || '';
  if(!sheetXml){
    // Try to find any sheet
    var keys = Object.keys(zip);
    for(var k=0;k<keys.length;k++){
      if(keys[k].match(/xl\/worksheets\/sheet\d+\.xml/)){sheetXml=zip[keys[k]];break;}
    }
  }
  if(!sheetXml){throw new Error('Could not find sheet data in XLSX.');}

  // Parse rows and cells
  var rows = [];
  var rowRe = /<row[^>]*>([\s\S]*?)<\/row>/g;
  var rowMatch;
  while((rowMatch=rowRe.exec(sheetXml))!==null){
    var cells = {};
    var cellRe = /<c r="([A-Z]+)(\d+)"([^>]*)>([\s\S]*?)<\/c>/g;
    var cellMatch;
    while((cellMatch=cellRe.exec(rowMatch[1]))!==null){
      var col = cellMatch[1];
      var attrs = cellMatch[3];
      var inner = cellMatch[4];
      var vMatch = inner.match(/<v>([\s\S]*?)<\/v>/);
      var val = vMatch ? vMatch[1] : '';
      // t="s" means shared string index
      if(attrs.indexOf('t="s"')!==-1 || attrs.indexOf("t='s'")!==-1){
        val = sharedStrings[parseInt(val)] || '';
      }
      // Decode XML entities
      val = val.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
      cells[col] = val;
    }
    // Convert column letters to array
    var maxCol = 0;
    Object.keys(cells).forEach(function(c){
      var n = colLetterToNum(c);
      if(n>maxCol)maxCol=n;
    });
    var arr = [];
    for(var c=1;c<=maxCol;c++){arr.push(cells[numToColLetter(c)]||'');}
    rows.push(arr);
  }
  return rows;
}

function colLetterToNum(letters){
  var n=0;
  for(var i=0;i<letters.length;i++){n=n*26+(letters.charCodeAt(i)-64);}
  return n;
}
function numToColLetter(n){
  var s='';
  while(n>0){s=String.fromCharCode(((n-1)%26)+65)+s;n=Math.floor((n-1)/26);}
  return s;
}

/* ── Simple ZIP reader for XLSX ── */
function unzipSimple(data){
  // Find central directory at end of file
  var files = {};
  var i = data.length-22;
  // Find end of central directory signature 0x06054b50
  while(i>=0){
    if(data[i]===0x50&&data[i+1]===0x4b&&data[i+2]===0x05&&data[i+3]===0x06){break;}
    i--;
  }
  if(i<0) return null;

  var cdOffset = data[i+16]|(data[i+17]<<8)|(data[i+18]<<16)|(data[i+19]<<24);
  var cdSize   = data[i+12]|(data[i+13]<<8)|(data[i+14]<<16)|(data[i+15]<<24);
  var pos = cdOffset;

  while(pos < cdOffset+cdSize){
    if(data[pos]!==0x50||data[pos+1]!==0x4b||data[pos+2]!==0x01||data[pos+3]!==0x02) break;
    var fnLen  = data[pos+28]|(data[pos+29]<<8);
    var exLen  = data[pos+30]|(data[pos+31]<<8);
    var cmLen  = data[pos+32]|(data[pos+33]<<8);
    var lhOff  = data[pos+42]|(data[pos+43]<<8)|(data[pos+44]<<16)|(data[pos+45]<<24);
    var fname  = '';
    for(var f=0;f<fnLen;f++) fname+=String.fromCharCode(data[pos+46+f]);
    pos += 46+fnLen+exLen+cmLen;

    // Read local file header
    var lh = lhOff;
    if(data[lh]!==0x50||data[lh+1]!==0x4b||data[lh+2]!==0x03||data[lh+3]!==0x04) continue;
    var compression = data[lh+6]|(data[lh+7]<<8);
    var compSize    = data[lh+18]|(data[lh+19]<<8)|(data[lh+20]<<16)|(data[lh+21]<<24);
    var lfnLen      = data[lh+26]|(data[lh+27]<<8);
    var lexLen      = data[lh+28]|(data[lh+29]<<8);
    var dataStart   = lh+30+lfnLen+lexLen;

    var fileData = data.subarray(dataStart, dataStart+compSize);
    if(compression===0){
      // Stored — no compression
      files[fname] = new TextDecoder('utf-8').decode(fileData);
    } else if(compression===8){
      // Deflate — use DecompressionStream if available
      try{
        // We'll handle this synchronously via a trick — store raw for later
        files[fname] = inflateSync(fileData);
      }catch(e){
        files[fname] = '';
      }
    }
  }
  return Object.keys(files).length ? files : null;
}

function inflateSync(data){
  // Use pako if available, otherwise attempt native DecompressionStream
  // For our purposes, return empty string — user should save as CSV for best results
  // This is a fallback; most modern XLSX files are deflate-compressed
  try{
    // Try using the browser's built-in DecompressionStream synchronously
    // (not available sync, so we just return empty and the error is caught)
    return '';
  }catch(e){return '';}
}

function processImportRows(rows){
  if(!rows || rows.length < 2){
    toast('File appears empty or has only headers.', 'error');
    return;
  }

  // Map headers
  var headerRow = rows[0];
  var colIndex = {}; // field -> column index
  headerRow.forEach(function(h, i){
    var norm = normalizeHeader(h);
    var field = COL_MAP[norm];
    if(field) colIndex[field] = i;
  });

  if(!colIndex.firstName && !colIndex.lastName){
    toast('Could not find First Name or Last Name columns. Check your file matches the template.', 'error');
    return;
  }

  // Parse each data row
  var parsed = [];
  var skipped = 0;
  for(var r = 1; r < rows.length; r++){
    var row = rows[r];
    // Skip totally empty rows
    if(row.every(function(c){return !String(c).trim();})){skipped++;continue;}

    var fn = colIndex.firstName!==undefined ? String(row[colIndex.firstName]||'').trim() : '';
    var ln = colIndex.lastName!==undefined  ? String(row[colIndex.lastName]||'').trim()  : '';
    if(!fn && !ln){skipped++;continue;}

    var grade   = colIndex.grade!==undefined   ? String(row[colIndex.grade]||'').trim()   : '';
    var teacher = colIndex.teacher!==undefined ? String(row[colIndex.teacher]||'').trim() : '';
    var iepRaw  = colIndex.iepDate!==undefined ? row[colIndex.iepDate] : '';
    var iepDate = parseExcelDate(iepRaw);
    var goalsRaw = colIndex.goals!==undefined ? String(row[colIndex.goals]||'').trim() : '';

    // Parse goals — semicolon or comma separated
    var goalList = [];
    if(goalsRaw){
      goalList = goalsRaw.split(/[;,]/).map(function(g){return g.trim();}).filter(function(g){return g.length>0;});
    }
    if(!goalList.length){
      goalList = ['On-Task Behavior','Following Directions','Positive Peer Interactions','Controlling Impulse Behavior'];
    }

    // Normalize grade to just number
    grade = grade.replace(/[^0-9]/g,'');

    parsed.push({fn:fn, ln:ln, grade:grade, teacher:teacher, iepDate:iepDate, goalList:goalList});
  }

  if(!parsed.length){
    toast('No valid student rows found.', 'error');
    return;
  }

  showImportPreview(parsed, skipped);
}

function confirmImport(){
  var parsed = window._pendingImport;
  if(!parsed || !parsed.length) return;
  var teachers = STATE.accounts.filter(function(a){return a.role==='teacher';});
  var added=0, updated=0;

  parsed.forEach(function(p){
    var displayName = p.fn+' '+p.ln.charAt(0)+'.';
    var uniqueName = STATE.students.includes(displayName) ? p.fn+' '+p.ln : displayName;
    // Check if already exists (either form)
    var existingName = STATE.students.includes(displayName) ? displayName :
                       STATE.students.includes(uniqueName)  ? uniqueName  : null;
    var finalName = existingName || uniqueName;

    // Find best teacher match
    var teacherMatch = teachers.find(function(t){
      if(!p.teacher) return false;
      return t.displayName.toLowerCase().includes(p.teacher.toLowerCase()) ||
             p.teacher.toLowerCase().includes(t.displayName.toLowerCase().split(' ').pop());
    });

    // Build goals array
    var goals = p.goalList.map(function(label){
      return {id:slugify(label), label:label, short:label.slice(0,12)};
    });

    if(existingName){
      // Update existing
      STATE.studentInfo[finalName] = {
        firstName:p.fn, lastName:p.ln,
        grade:p.grade, teacher:p.teacher,
        iepDate:p.iepDate
      };
      STATE.goals[finalName] = goals;
      updated++;
    } else {
      // Add new
      STATE.students.push(finalName);
      STATE.studentInfo[finalName] = {
        firstName:p.fn, lastName:p.ln,
        grade:p.grade, teacher:p.teacher,
        iepDate:p.iepDate
      };
      STATE.goals[finalName] = goals;
      added++;
    }

    // Assign to teacher roster
    if(teacherMatch){
      if(!STATE.assignments[teacherMatch.id]) STATE.assignments[teacherMatch.id]=[];
      if(!STATE.assignments[teacherMatch.id].includes(finalName)){
        STATE.assignments[teacherMatch.id].push(finalName);
      }
    }
  });

  saveAll();
  window._pendingImport = null;
  cancelImport();
  toast('Import complete — '+added+' added, '+updated+' updated.');
  adminTab('students');
}

function cancelImport(){
  var el = document.getElementById('import-preview');
  if(el){ el.style.display='none'; el.innerHTML=''; }
  window._pendingImport = null;
}

// Sync settings — stored separately from student data
var SYNC_KEYS={url:"psp-sync-url",enabled:"psp-sync-enabled",lastSync:"psp-sync-last",lastStatus:"psp-sync-status"};
var SS={
  get url(){return localStorage.getItem(SYNC_KEYS.url)||"";},
  set url(v){localStorage.setItem(SYNC_KEYS.url,v);},
  get enabled(){return localStorage.getItem(SYNC_KEYS.enabled)==="true";},
  set enabled(v){localStorage.setItem(SYNC_KEYS.enabled,String(v));},
  get lastSync(){return localStorage.getItem(SYNC_KEYS.lastSync)||null;},
  set lastSync(v){localStorage.setItem(SYNC_KEYS.lastSync,v);},
  get lastStatus(){return localStorage.getItem(SYNC_KEYS.lastStatus)||"none";},
  set lastStatus(v){localStorage.setItem(SYNC_KEYS.lastStatus,v);},
};

function showSyncBanner(msg,icon,permanent){
  var b=document.getElementById("sync-banner");
  if(!b)return;
  document.getElementById("sync-icon").textContent=icon==="spin"?"↻":icon;
  document.getElementById("sync-msg").textContent=msg;
  b.style.display="flex";
  if(icon==="spin") b.firstElementChild.style.animation="spin 1s linear infinite";
  else b.firstElementChild.style.animation="";
  if(!permanent) setTimeout(function(){b.style.display="none";},4000);
}

function buildSyncPayload(date){
  var rows=[];
  STATE.students.forEach(function(name){
    var goals=getStudentGoals(name);
    var inf=STATE.studentInfo[name]||{};
    var dd=STATE.data[name]&&STATE.data[name][date];
    if(!dd)return;
    PERIODS.forEach(function(period){
      var ps=dd[period]||{};
      var periodSum=goals.reduce(function(a,g){return a+(ps[g.id]||0);},0);
      var periodCount=goals.filter(function(g){return ps[g.id]!=null;}).length;
      var row={
        date:date,
        student:name,
        firstName:inf.firstName||"",
        lastName:inf.lastName||"",
        grade:inf.grade||"",
        teacher:inf.teacher||"",
        iepDate:inf.iepDate||"",
        period:period,
        periodTotal:periodCount>0?periodSum:null,
        periodPct:periodCount>0?pct(periodSum,periodCount):null,
      };
      goals.forEach(function(g){
        row["goal_"+g.id]=ps[g.id]!=null?ps[g.id]:null;
        row["goal_"+g.id+"_label"]=g.label;
      });
      rows.push(row);
    });
    // Daily summary row
    var daily=calcTotal(dd,goals);
    rows.push({
      date:date,student:name,
      firstName:inf.firstName||"",lastName:inf.lastName||"",
      grade:inf.grade||"",teacher:inf.teacher||"",iepDate:inf.iepDate||"",
      period:"DAILY TOTAL",
      periodTotal:daily.sum,
      periodPct:daily.count>0?pct(daily.sum,daily.count):null,
    });
  });
  return{syncedAt:new Date().toISOString(),date:date,school:"PointSheet Pro",rows:rows};
}

function runSync(date,silent){
  var url=SS.url.trim();
  if(!url){if(!silent)toast("No Power Automate URL configured. Go to Admin → Excel Sync.","error");return;}
  if(!silent)showSyncBanner("Syncing to Excel…","spin",true);
  var payload=buildSyncPayload(date||todayKey());
  if(!payload.rows.length){showSyncBanner("No data to sync for this date","⚠️",false);SS.lastStatus="none";return;}
  fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
    .then(function(){
      SS.lastSync=new Date().toLocaleString();
      SS.lastStatus="ok";
      if(!silent)showSyncBanner("Synced "+payload.rows.length+" rows to Excel ✅","✅",false);
      // Refresh sync tab if open
      if(STATE.adminTab==="sync") adminTab("sync");
    })
    .catch(function(e){
      SS.lastStatus="error";
      if(!silent){showSyncBanner("Sync failed — check your URL","❌",false);toast("Sync failed: "+e.message,"error");}
    });
}

function scheduleNightlySync(){
  setInterval(function(){
    if(!SS.enabled||!SS.url)return;
    var hour=new Date().getHours();
    if(hour<20)return; // after 8pm only
    var today=todayKey();
    var lastDate=(SS.lastSync||"").split(",")[0];
    if(lastDate===today)return; // already synced today
    runSync(today,false);
  },60*60*1000); // check every hour
}

function saveSyncUrl(){
  var v=(document.getElementById("sync-url-inp")||{}).value||"";
  v=v.trim();
  if(v&&!v.startsWith("https://")){toast("URL must start with https://","error");return;}
  SS.url=v;
  toast(v?"Webhook URL saved! Click ▶ Test Sync Now to verify.":"URL cleared.");
  adminTab("sync");
}
